<!doctype html>
<!-- Calibration page for the frame recorder (harness/uibench): a known cadence to check the compositor numbers.
     ?hz=60 repaints a block every animation frame, ?hz=30 every second frame, ?hz=0 never. ?bench_port= the runner's
     report port: the page posts its own rAF count there every second, to compare with the presented frames. -->
<html><head><meta charset="utf-8"><title>uibench calibration</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}#b{position:absolute;left:40%;top:40%;width:20%;height:20%}</style>
</head><body><div id="b"></div><script>
const q = new URLSearchParams(location.search), hz = +(q.get("hz") ?? 60), port = q.get("bench_port") || "18099";
const b = document.getElementById("b");
let n = 0, raf = 0, last = performance.now(), iv = [];
function tick(t) {
  raf++; iv.push(t - last); last = t;
  if (hz && (raf % Math.round(60 / hz) === 0)) { n++; b.style.background = n % 2 ? "#e33" : "#3e3"; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
setInterval(() => {
  const s = [...iv].sort((a, b) => a - b), body = JSON.stringify({ kind: "calib", hz, raf, paints: n, iv_p50: s[s.length >> 1], iv_max: s[s.length - 1], timeOrigin: performance.timeOrigin, now: performance.now() });
  iv = [];
  try { navigator.sendBeacon(`http://127.0.0.1:${port}/report`, body); } catch {}
}, 1000);
</script></body></html>
