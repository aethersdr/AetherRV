# AetherRV bench configuration: every bus is a vcan, every device a simulator. NEVER used in the van.
capture = true
capture_dir = "/var/lib/aetherrv/captures"
capture_keep_days = 1

[history]
path = "/var/lib/aetherrv/history.sqlite3"

[web]
host = "0.0.0.0"
port = 8080
ui_dir = "/opt/aetherrv-rs/ui"   # the React bundle (static_dir is the Python UI's key)
admin_socket = "/run/aetherrv-admin.sock"

[bus.hat0]
interface = "socketcan"
channel = "vcan0"

[bus.hat1]
interface = "socketcan"
channel = "vcan1"

# a bus no device owns: aetherrv-can-aux@aux0 watches it (the van's fd0/fd1 kind)
[bus.aux0]
interface = "socketcan"
channel = "vcan2"

[device.espar]
kind = "espar"
bus = "hat1"
tx_enabled = true
diag_tx = true
diag_interval_s = 1
room_source = "average"   # as the van (2026-11-27): the cabin mean of the front and rear Ruuvis and the MCS7 sensor

[device.n2k]
kind = "n2k"
bus = "hat0"
tx_enabled = true   # vcan0 + the CLMD16 simulator only

[power]
# as in the van: the heat lockout and the low-battery power-off are live (the Cerbo simulator reports 85.8 % SoC,
# far above heater_off_soc 10 % and shutdown_soc 5 %, so they never trigger on the bench)
auto_shutdown = true

[device.rixens_http]
kind = "rixens_http"
enabled = true
host = "127.0.0.1:18111"
interval = 5
tx_enabled = true

[device.victron]
kind = "victron"
host = "127.0.0.1"
port = 18883
tls = false
cabin_temp = "IAT"
outside_temp = "OAT"
fridge_temp = "FRG"
freezer_temp = "FRZ"
cabin_rear_temp = "RCT"

[climate]
cabin_source = "average"

[gps]
enabled = true
port = 10110
bind = "127.0.0.1"

[netmon]
interval = 30

[[netmon.targets]]
name = "loopback"
host = "127.0.0.1"
fail_after = 2

[radar]
dir = "/var/lib/aetherrv/radar"

[device.starlink]
kind = "starlink"
enabled = true
target = "127.0.0.1:9200"
interval = 5

[device.peplink]
kind = "peplink"
enabled = true
host = "127.0.0.1:8443"
verify_tls = false

# switching against aetherrv-sim-clmd16 on vcan0 (invented layout in the van's shape)
[device.n2k.switching]
controller = 0
bank = 32
vsw_bank = 33
press_s = 0.4
address = 150

[[device.n2k.switch]]
bank = 32
channel = 1
press = 1
name = "Spot lights"
requires_input = 2

[[device.n2k.switch]]
bank = 32
channel = 7
press = 7
name = "Water pump"

[[device.n2k.switch]]
bank = 32
channel = 12
press = 12
name = "Cabin lights"
kind = "dimmer"

[[device.n2k.switch]]
bank = 32
channel = 15
press = 8
name = "Starlink"

[[device.n2k.input]]
input = 2
name = "Ignition"
