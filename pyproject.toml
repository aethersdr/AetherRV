[project]
name = "aetherrv"
license = "GPL-3.0-only"
version = "0.1.0"
description = "Sprinter RV central console: Victron, NMEA 2000 (Maretron), Rixens MCS7, Espar"
requires-python = ">=3.12"
dependencies = [
    "python-can>=4.4",
    "aiohttp>=3.10",
    "aiomqtt>=2.3",
    "starlink-grpc-core>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
aetherrv = "aetherrv.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-aiohttp>=1.1.1",
]
