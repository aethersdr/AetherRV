# AetherRV bus (aetherrv-bus.service): Mosquitto on a Unix socket ONLY. Nothing on the LAN or the tailnet can reach
# it; the directory is root:aetherrv 0750. Remote users go through the gateway.
per_listener_settings false
listener 0 /run/aetherrv/bus/mqtt.sock
allow_anonymous true
acl_file /opt/aetherrv-rs/etc/mosquitto.acl
persistence true
persistence_location /var/lib/aetherrv/bus/
autosave_interval 30
max_packet_size 16777216
log_dest stderr
log_type error
log_type warning
