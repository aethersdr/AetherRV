# AetherRV panel (Rust system): sway on the touchscreen with one fullscreen UI runtime, no bar, no keybindings.
# The same session as the Python kiosk (deploy/kiosk/sway.conf): sway can power the HDMI output off/on without
# removing it, so the UI keeps running while the panel sleeps (aetherrv-screen does that for the Settings page).
xwayland disable
output * bg #000000 solid_color
output HDMI-A-1 mode 1920x1200@59.950Hz
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 100
for_window [app_id=".*"] fullscreen enable, border none
input type:touch map_to_output HDMI-A-1

# Screen power helper (127.0.0.1:8091, loopback only); exits with sway.
exec /opt/aetherrv-rs/bin/aetherrv-screen
# The UI runtime; when it exits, the session ends and systemd restarts the panel.
exec /opt/aetherrv-rs/panel/launch.sh
