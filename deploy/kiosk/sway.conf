# AetherRV touchscreen kiosk on sway (replaces cage, which has no display power control).
# One fullscreen Chromium, no bar, no keybindings. Sway can power the HDMI output off/on
# ("output * power off") without removing it, so Chromium keeps running while the panel sleeps.
xwayland disable
output * bg #000000 solid_color
output HDMI-A-1 mode 1920x1200@59.950Hz
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 100
for_window [app_id=".*"] fullscreen enable, border none
input type:touch map_to_output HDMI-A-1

# Screen power helper for the console page (127.0.0.1:8091, loopback only).
exec /usr/bin/python3 /opt/aetherrv/deploy/kiosk/screen_helper.py
# Chromium; when it exits, end the session so systemd restarts the whole kiosk.
exec /opt/aetherrv/deploy/kiosk/chromium.sh
